<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Msxzn Smart Manual Logger</title>
    
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f4f4f9;
        }

        h1 {
            color: #1a73e8; 
        }
        
        #status-bar {
            width: 640px;
            margin: 10px auto;
            padding: 10px;
            font-weight: bold;
            border-radius: 5px;
            color: white;
        }
        .status-ready { background-color: #4CAF50; } /* Hijau */
        .status-wait { background-color: #f44336; }  /* Merah */

        #camera-area {
            width: 640px;
            height: 480px;
            margin: 10px auto;
            border: 5px solid #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden;
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.9;
        }
        
        /* Area Kontrol Tombol */
        #control-area {
            width: 640px;
            margin: 20px auto;
            padding: 15px;
            border: 1px solid #ccc;
            background-color: #fff;
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 10px;
        }
        
        .counter-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        .counter-btn:hover:not(:disabled) {
            background-color: #45a049;
        }
        
        /* Gaya tombol saat filter aktif (dinonaktifkan) */
        .counter-btn:disabled {
            background-color: #cccccc;
            cursor: not-allowed;
        }

        /* Gaya untuk Tabel Hasil */
        #log-area {
            width: 640px;
            margin: 30px auto;
            text-align: left;
        }
        #inventory-table {
            width: 100%;
            border-collapse: collapse;
        }
        #inventory-table th, #inventory-table td {
            border: 1px solid #ddd;
            padding: 10px;
        }
        #inventory-table th {
            padding-top: 12px;
            padding-bottom: 12px;
            text-align: left;
            background-color: #1a73e8;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Msxzn Smart Manual Logger</h1>
    
    <div id="status-bar" class="status-wait">FILTER AKTIF: Letakkan Barang di Depan Kamera</div>

    <div id="camera-area">
        <video id="video" autoplay muted></video>
    </div>
    
    <div id="control-area">
        <p>Tombol akan muncul di sini.</p>
    </div>
    
    <div id="log-area">
        <h2>Catatan Barang</h2>
        <table id="inventory-table">
            <thead>
                <tr>
                    <th>Nama Barang</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="inventory-body">
                </tbody>
        </table>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <script>
        const video = document.getElementById('video');
        const controlArea = document.getElementById('control-area');
        const tableBody = document.getElementById('inventory-body');
        const statusBar = document.getElementById('status-bar');

        let model = undefined;
        let isReadyToCount = false; // Status filterisasi

        // --- 1. DAFTAR BARANG YANG AKAN DIHITUNG ---
        const itemList = [
            'Kartu A',
            'Kartu B',
            'Stiker Gold',
            'Stiker Silver',
            'Kotak Kecil'
        ];
        
        let inventory = {}; 

        // --- 2. SETUP KAMERA & MODEL AI ---
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                video.play();
                video.onloadeddata = loadModel; // Lanjut muat model setelah video siap
            } catch (err) {
                console.error("Gagal mengakses kamera:", err);
                statusBar.textContent = "ERROR: Gagal akses kamera. Cek izin browser!";
                statusBar.className = "status-wait";
            }
        }

        async function loadModel() {
            statusBar.textContent = "Memuat model filter AI...";
            statusBar.className = "status-wait";
            model = await cocoSsd.load();
            statusBar.textContent = "Model Filter AI Siap. Tunggu Objek Terdeteksi.";
            detectFrame(); // Mulai deteksi untuk filterisasi
        }

        // --- 3. LOGIKA FILTERISASI (Deteksi Objek) ---
        function detectFrame() {
            if (video.readyState !== 4 || !model) {
                requestAnimationFrame(detectFrame);
                return;
            }

            model.detect(video).then(predictions => {
                // Filter prediksi yang akurat
                const filteredPredictions = predictions.filter(p => p.score > 0.60); // Akurasi 60% cukup

                const wasReady = isReadyToCount;
                
                if (filteredPredictions.length > 0) {
                    // ADA OBJEK
                    isReadyToCount = true;
                    if (!wasReady) {
                        statusBar.textContent = `SIAP HITUNG! ${filteredPredictions.length} objek terdeteksi.`;
                        statusBar.className = "status-ready";
                        toggleButtons(true);
                    }
                } else {
                    // TIDAK ADA OBJEK
                    isReadyToCount = false;
                    if (wasReady) {
                        statusBar.textContent = "FILTER AKTIF: Letakkan Barang di Depan Kamera";
                        statusBar.className = "status-wait";
                        toggleButtons(false);
                    }
                }

                requestAnimationFrame(detectFrame);
            });
        }
        
        // --- 4. FUNGSI UNTUK MENGAKTIFKAN/MENONAKTIFKAN TOMBOL ---
        function toggleButtons(enable) {
            const buttons = controlArea.querySelectorAll('.counter-btn');
            buttons.forEach(btn => {
                // Pastikan tombol reset tidak dinonaktifkan
                if (btn.id !== 'reset-btn') {
                    btn.disabled = !enable;
                }
            });
        }

        // --- 5. LOGIKA UTAMA HITUNGAN MANUAL ---
        function renderInventoryTable() {
            tableBody.innerHTML = '';
            for (const item in inventory) {
                const count = inventory[item];
                if (count > 0) {
                    const row = tableBody.insertRow();
                    row.insertCell(0).textContent = item;
                    row.insertCell(1).textContent = count;
                }
            }
        }
        
        function incrementCount(itemName) {
            if (!isReadyToCount) return; // JAGA-JAGA: Cegah hitungan jika filter belum siap

            inventory[itemName] = (inventory[itemName] || 0) + 1;
            renderInventoryTable();
        }

        // --- 6. MEMBUAT TOMBOL AWAL ---
        function setupButtons() {
            controlArea.innerHTML = '';
            
            itemList.forEach(itemName => {
                inventory[itemName] = 0; 
                
                const button = document.createElement('button');
                button.className = 'counter-btn';
                button.textContent = `(+) ${itemName}`;
                button.disabled = true; // Nonaktifkan secara default
                
                button.onclick = () => incrementCount(itemName);
                
                controlArea.appendChild(button);
            });
            
            // Tambahkan tombol Reset
            const resetButton = document.createElement('button');
            resetButton.id = 'reset-btn';
            resetButton.className = 'counter-btn';
            resetButton.style.backgroundColor = '#f44336';
            resetButton.textContent = 'Reset Semua Hitungan';
            resetButton.onclick = () => {
                if (confirm("Apakah Anda yakin ingin mereset semua hitungan?")) {
                    inventory = {}; 
                    setupButtons(); 
                    renderInventoryTable();
                    // Pastikan tombol diaktifkan/dinonaktifkan sesuai status AI saat ini
                    toggleButtons(isReadyToCount);
                }
            };
            controlArea.appendChild(resetButton);
        }

        // --- EKSEKUSI UTAMA ---
        async function main() {
            setupButtons();
            setupCamera();
            // Pasang fungsi incrementCount agar bisa diakses dari tombol onclick
            window.incrementCount = incrementCount; 
        }

        main();
    </script>
</body>
</html>
