<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Msxzn Manual Camera Logger</title>
    
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f4f4f9;
        }

        h1 {
            color: #1a73e8; 
        }

        #camera-area {
            width: 640px;
            height: 480px;
            margin: 20px auto;
            border: 5px solid #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            overflow: hidden; /* Pastikan video pas di dalam */
        }

        #video {
            width: 100%;
            height: 100%;
            object-fit: cover; /* Pastikan video mengisi area */
            opacity: 0.9;
        }
        
        /* Area Kontrol Tombol */
        #control-area {
            width: 640px;
            margin: 20px auto;
            padding: 15px;
            border: 1px solid #ccc;
            background-color: #fff;
            display: flex;
            flex-wrap: wrap; /* Biar tombol bisa ke bawah */
            justify-content: center;
            gap: 10px;
        }
        
        .counter-btn {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 16px;
            cursor: pointer;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        .counter-btn:hover {
            background-color: #45a049;
        }

        /* Gaya untuk Tabel Hasil */
        #log-area {
            width: 640px;
            margin: 30px auto;
            text-align: left;
        }
        #inventory-table {
            width: 100%;
            border-collapse: collapse;
        }
        #inventory-table th, #inventory-table td {
            border: 1px solid #ddd;
            padding: 10px;
        }
        #inventory-table th {
            padding-top: 12px;
            padding-bottom: 12px;
            text-align: left;
            background-color: #1a73e8;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Msxzn Manual Camera Logger</h1>
    
    <div id="camera-area">
        <video id="video" autoplay muted></video>
    </div>
    
    <div id="control-area">
        <p>Tombol untuk setiap item akan muncul di sini. Klik (+) setiap kali item masuk frame.</p>
    </div>
    
    <div id="log-area">
        <h2>Catatan Barang</h2>
        <table id="inventory-table">
            <thead>
                <tr>
                    <th>Nama Barang</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody id="inventory-body">
                </tbody>
        </table>
    </div>
    
    <script>
        const video = document.getElementById('video');
        const controlArea = document.getElementById('control-area');
        const tableBody = document.getElementById('inventory-body');

        // --- 1. DAFTAR BARANG YANG AKAN DIHITUNG ---
        // Anda bisa tambahkan atau ganti nama-nama barang di sini
        const itemList = [
            'Kartu A',
            'Kartu B',
            'Stiker Gold',
            'Stiker Silver',
            'Kotak Kecil'
        ];
        
        // Objek untuk menyimpan jumlah saat ini
        let inventory = {}; 

        // --- 2. SETUP KAMERA ---
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } // Coba kamera belakang
                });
                video.srcObject = stream;
                video.play();
            } catch (err) {
                console.error("Gagal mengakses kamera:", err);
                alert("Gagal mengakses kamera. Pastikan izin kamera diberikan melalui server web (http://).");
            }
        }

        // --- 3. FUNGSI UNTUK MEMPERBARUI TABEL ---
        function renderInventoryTable() {
            tableBody.innerHTML = ''; // Kosongkan isi tabel
            
            // Loop melalui setiap item yang ada di objek inventory
            for (const item in inventory) {
                const count = inventory[item];
                // Hanya tampilkan jika jumlahnya lebih dari 0
                if (count > 0) {
                    const row = tableBody.insertRow();
                    const nameCell = row.insertCell(0);
                    const countCell = row.insertCell(1);

                    nameCell.textContent = item;
                    countCell.textContent = count;
                }
            }
        }
        
        // --- 4. FUNGSI UNTUK MENAMBAH HITUNGAN ---
        function incrementCount(itemName) {
            // Tambah 1 ke jumlah item tersebut
            inventory[itemName] = (inventory[itemName] || 0) + 1;
            
            // Perbarui tampilan tabel
            renderInventoryTable();
            
            console.log(`[LOG] ${itemName} dihitung. Total: ${inventory[itemName]}`);
        }

        // --- 5. FUNGSI UNTUK MEMBUAT TOMBOL ---
        function setupButtons() {
            controlArea.innerHTML = ''; // Hapus pesan default
            
            itemList.forEach(itemName => {
                // Inisialisasi jumlah awal item
                inventory[itemName] = 0; 
                
                const button = document.createElement('button');
                button.className = 'counter-btn';
                button.textContent = `(+) ${itemName}`;
                
                // Gunakan fungsi incrementCount saat tombol diklik
                button.onclick = () => incrementCount(itemName);
                
                controlArea.appendChild(button);
            });
            
            // Tambahkan tombol Reset
            const resetButton = document.createElement('button');
            resetButton.className = 'counter-btn';
            resetButton.style.backgroundColor = '#f44336';
            resetButton.textContent = 'Reset Semua Hitungan';
            resetButton.onclick = () => {
                if (confirm("Apakah Anda yakin ingin mereset semua hitungan?")) {
                    inventory = {}; // Kosongkan inventory
                    setupButtons(); // Set ulang tombol dan inventory
                    renderInventoryTable(); // Bersihkan tabel
                }
            };
            controlArea.appendChild(resetButton);
        }

        // --- EKSEKUSI UTAMA ---
        async function main() {
            // 1. Setup tombol (dan menginisialisasi inventory)
            setupButtons();
            
            // 2. Akses dan tampilkan kamera
            setupCamera();
        }

        main();
    </script>
</body>
</html>
