<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Msxzn Camera Logger</title>
    
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f4f4f9;
        }

        h1 {
            color: #1a73e8; 
        }

        #camera-area {
            position: relative; 
            width: 640px;
            height: 480px;
            margin: 20px auto;
            border: 5px solid #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        #video, #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #video {
            opacity: 0.9;
        }
        
        #canvas {
            z-index: 10; 
        }

        /* Gaya untuk area tombol/label yang digambar di atas canvas */
        .prediction-label {
            position: absolute;
            z-index: 11; /* Lebih tinggi dari canvas */
            background-color: rgba(255, 255, 255, 0.9);
            padding: 5px;
            border-radius: 3px;
            font-size: 14px;
            cursor: pointer;
            border: 2px solid #000000;
        }
        .prediction-label button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 5px 10px;
            margin-left: 10px;
            cursor: pointer;
            border-radius: 3px;
        }

        /* Gaya untuk Tabel Hasil */
        #log-area {
            width: 640px;
            margin: 30px auto;
            text-align: left;
        }
        #inventory-table {
            width: 100%;
            border-collapse: collapse;
        }
        #inventory-table th, #inventory-table td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        #inventory-table th {
            padding-top: 12px;
            padding-bottom: 12px;
            text-align: left;
            background-color: #1a73e8;
            color: white;
        }
    </style>
</head>
<body>
    <h1>Msxzn Camera Inventory Logger</h1>
    
    <div id="camera-area">
        <video id="video" autoplay muted></video>
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>
    
    <div id="log-area">
        <h2>Catatan Barang</h2>
        <table id="inventory-table">
            <thead>
                <tr>
                    <th>Nama Barang (AI Deteksi)</th>
                    <th>Jumlah</th>
                </tr>
            </thead>
            <tbody>
                </tbody>
        </table>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const cameraArea = document.getElementById('camera-area');
        const tableBody = document.querySelector('#inventory-table tbody');

        let model = undefined;
        // Objek untuk menyimpan ID objek yang sudah ada di tabel (akumulasi)
        let inventory = {}; 
        // Array untuk menyimpan elemen tombol di layar, agar bisa dihapus tiap frame
        let currentLabels = [];

        // --- FUNGSI UTAMA UNTUK MENGAKSES KAMERA ---
        async function setupCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { facingMode: 'environment' } 
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadeddata = () => { resolve(video); };
                });
            } catch (err) {
                console.error("Gagal mengakses kamera:", err);
                alert("Gagal mengakses kamera. Pastikan izin kamera diberikan.");
            }
        }

        // --- FUNGSI UNTUK MEMUAT MODEL AI ---
        async function loadModel() {
            console.log("Memuat model COCO-SSD...");
            model = await cocoSsd.load();
            console.log("Model siap. Mulai deteksi.");
            detectFrame();
        }

        // --- FUNGSI UNTUK MENAMBAH/MENGURANGI STOK ---
        function updateInventory(itemName, action) {
            // Bersihkan nama item (misal: 'bottle' menjadi 'Bottle')
            const cleanName = itemName.charAt(0).toUpperCase() + itemName.slice(1);
            
            // Tambah jumlah
            if (action === 'add') {
                inventory[cleanName] = (inventory[cleanName] || 0) + 1;
            } 
            
            // Perbarui tampilan tabel
            renderInventoryTable();
        }

        // --- FUNGSI UNTUK MEMPERBARUI TABEL ---
        function renderInventoryTable() {
            tableBody.innerHTML = ''; // Kosongkan isi tabel
            
            for (const item in inventory) {
                if (inventory[item] > 0) {
                    const row = tableBody.insertRow();
                    const nameCell = row.insertCell(0);
                    const countCell = row.insertCell(1);

                    nameCell.textContent = item;
                    countCell.textContent = inventory[item];
                }
            }
        }
        
        // --- FUNGSI DETEKSI DAN GAMBAR TOMBOL ---
        function detectFrame() {
            if (video.readyState !== 4 || !model) {
                requestAnimationFrame(detectFrame);
                return;
            }

            // 1. Hapus semua tombol dari frame sebelumnya
            currentLabels.forEach(label => label.remove());
            currentLabels = [];
            
            ctx.clearRect(0, 0, canvas.width, canvas.height); // Bersihkan canvas

            model.detect(video).then(predictions => {

                predictions.forEach(prediction => {
                    if (prediction.score > 0.70) { // Gunakan akurasi lebih tinggi (70%)
                        const [x, y, width, height] = prediction.bbox;

                        // 2. Gambar Bounding Box (Kotak Hijau)
                        ctx.strokeStyle = "#4CAF50";
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x, y, width, height);

                        // 3. Buat Elemen Tombol/Label
                        const label = document.createElement('div');
                        label.className = 'prediction-label';
                        
                        // Isi label
                        label.innerHTML = `
                            ${prediction.class} 
                            <button onclick="updateInventory('${prediction.class}', 'add')">+</button>
                        `;

                        // Posisikan label di atas kotak deteksi
                        label.style.left = `${x}px`;
                        label.style.top = `${y - 30}px`; // Naikkan 30px dari atas kotak

                        // 4. Tambahkan ke DOM dan simpan di array currentLabels
                        cameraArea.appendChild(label);
                        currentLabels.push(label);
                    }
                });

                requestAnimationFrame(detectFrame);
            });
        }

        // --- EKSEKUSI ---
        async function main() {
            await setupCamera();
            video.play();
            loadModel();
            
            // Pasang fungsi updateInventory agar bisa diakses dari tombol onclick
            window.updateInventory = updateInventory; 
        }

        main();
    </script>
</body>
</html>
