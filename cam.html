<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <title>Msxzn Camera Object Counter</title>
    
    <style>
        body {
            font-family: sans-serif;
            text-align: center;
            background-color: #f4f4f9;
        }

        h1 {
            color: #1a73e8; /* Warna khas Google/Web */
        }

        #container {
            position: relative; 
            width: 640px;
            height: 480px;
            margin: 20px auto;
            border: 5px solid #333;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        /* Video dan Canvas harus ditumpuk agar gambar deteksi berada di atas feed kamera */
        #video, #canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }

        #video {
            /* Sedikit transparansi agar bounding box di canvas terlihat jelas */
            opacity: 0.9;
            transform: scaleX(-1); /* Membalikkan video agar seperti cermin */
        }
        
        #canvas {
            /* Pastikan canvas ada di lapisan teratas */
            z-index: 10; 
        }

        #counter-display {
            margin-top: 20px; 
            padding: 15px;
            font-size: 1.8em;
            font-weight: bold;
            background-color: #333;
            color: #4CAF50; /* Hijau untuk hasil hitungan */
            width: 640px;
            margin: 20px auto 0;
        }
    </style>
</head>
<body>
    <h1>Msxzn Camera Counter</h1>
    
    <div id="container">
        <video id="video" autoplay muted></video>
        
        <canvas id="canvas" width="640" height="480"></canvas>
    </div>
    
    <div id="counter-display">
        Jumlah Barang Terhitung: <span id="count">0</span>
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd"></script>
    
    <script>
        // Pengaturan global
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const countDisplay = document.getElementById('count');

        let model = undefined;
        let objectCounter = 0;
        // Set untuk melacak objek yang sudah dihitung agar tidak dihitung berulang-ulang.
        let countedObjects = new Set(); 

        // --- 1. Definisi Kotak Hitungan (ROI) ---
        // Di sini saya buat kotak 200x150 di tengah bawah (relatif terhadap canvas 640x480)
        const ROI = {
            x: 220, // (640 - 200) / 2
            y: 300, // Dari atas
            width: 200,
            height: 150
        };

        // --- 2. Inisialisasi Kamera dan Model AI ---
        async function setupCamera() {
            try {
                // Mencoba mendapatkan feed kamera
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { 
                        facingMode: 'environment' // Coba gunakan kamera belakang (di HP)
                    } 
                });
                video.srcObject = stream;
                return new Promise((resolve) => {
                    video.onloadeddata = () => {
                        resolve(video);
                    };
                });
            } catch (err) {
                console.error("Gagal mengakses kamera:", err);
                alert("Gagal mengakses kamera. Pastikan izin kamera diberikan.");
            }
        }

        async function loadModel() {
            console.log("Memuat model COCO-SSD...");
            // Model COCO-SSD digunakan untuk mendeteksi objek umum (botol, cangkir, dll.)
            model = await cocoSsd.load();
            console.log("Model siap. Mulai deteksi.");
            detectFrame();
        }

        // --- 3. Logika Deteksi dan Hitungan Presisi ---
        function isInsideROI(box) {
            // box = [y_min, x_min, y_max, x_max] dari hasil deteksi
            const [x, y, width, height] = box; 

            // Cek apakah pusat (center) objek berada di dalam ROI
            const centerX = x + width / 2;
            const centerY = y + height / 2;

            return (
                centerX >= ROI.x && 
                centerX <= (ROI.x + ROI.width) &&
                centerY >= ROI.y && 
                centerY <= (ROI.y + ROI.height)
            );
        }

        function detectFrame() {
            // Periksa apakah video siap dan model AI telah dimuat
            if (video.readyState !== 4 || !model) {
                requestAnimationFrame(detectFrame);
                return;
            }

            // Lakukan deteksi objek dari frame video saat ini
            model.detect(video).then(predictions => {
                // Bersihkan canvas dari gambar sebelumnya
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                // Gambar Kotak Hitungan (ROI) - Area Fokus Anda
                ctx.strokeStyle = "red";
                ctx.lineWidth = 3;
                ctx.strokeRect(ROI.x, ROI.y, ROI.width, ROI.height);
                ctx.fillStyle = "rgba(255, 0, 0, 0.1)"; 
                ctx.fillRect(ROI.x, ROI.y, ROI.width, ROI.height);
                ctx.font = '16px Arial';
                ctx.fillStyle = 'red';
                ctx.fillText('KOTAK HITUNGAN', ROI.x, ROI.y - 5);

                let currentFrameObjects = new Set(); // Objek yang terdeteksi di frame ini

                predictions.forEach(prediction => {
                    // Gunakan hanya deteksi dengan kepercayaan tinggi
                    if (prediction.score > 0.65) {
                        const [x, y, width, height] = prediction.bbox;

                        // 1. Gambar Bounding Box Objek
                        ctx.strokeStyle = "green";
                        ctx.lineWidth = 2;
                        ctx.strokeRect(x, y, width, height);
                        ctx.fillStyle = "green";
                        ctx.fillText(`${prediction.class} (${Math.round(prediction.score * 100)}%)`, x, y > 10 ? y - 5 : 10);

                        // 2. Terapkan Logika Hitungan Presisi
                        if (isInsideROI(prediction.bbox)) {
                            // Buat ID unik berdasarkan kelas dan perkiraan posisi
                            const objectId = `${prediction.class}-${Math.floor(x/10)}-${Math.floor(y/10)}`; 

                            // Hitung hanya jika objek ini belum pernah tercatat di countedObjects
                            if (!countedObjects.has(objectId)) {
                                objectCounter++;
                                countedObjects.add(objectId);
                                countDisplay.textContent = objectCounter;

                                // Visualisasi: Ubah warna kotak saat hitungan terjadi
                                ctx.strokeStyle = "blue"; 
                                ctx.strokeRect(x, y, width, height);
                                ctx.fillStyle = "blue";
                                ctx.fillText("DIHITUNG!", x, y + 15);
                            }
                            
                            // Tambahkan ID objek ke set objek yang ada di frame saat ini
                            currentFrameObjects.add(objectId);
                        }
                    }
                });
                
                // Pembersihan Set: Hapus objek yang sudah tidak terlihat/berada di luar frame
                // Ini adalah pelacakan yang sangat sederhana.
                countedObjects = new Set([...countedObjects].filter(id => currentFrameObjects.has(id)));


                // Ulangi proses pada frame berikutnya
                requestAnimationFrame(detectFrame);
            });
        }

        // --- 4. Fungsi Utama untuk Memulai ---
        async function main() {
            await setupCamera();
            video.play();
            loadModel();
        }

        main();
    </script>
</body>
</html>
